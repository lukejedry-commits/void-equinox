<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Void Equinox: Ashes of Autumn</title></head>
<body>
  <div id="app"></div>
  <div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#140d0a;color:#ffd9a0;font:14px/1.4 monospace;z-index:20">Loading physics…</div>
  <div id="settings">Quality <select id="quality"><option value="auto">Auto</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select><br><label>Controls <select id="controls"><option value="pc">PC</option><option value="phone">Phone</option><option value="tablet">Tablet</option></select></label><br><label>FOV <input id="fov" type="range" min="60" max="80" step="1" value="60"> <span id="fovVal">60</span>°</label><br><label>Brightness <input id="bright" type="range" min="-0.25" max="0.25" step="0.05" value="0"> <span id="brightVal">0.00</span> stop</label><br><canvas id="brightRef" width="96" height="48" style="vertical-align:middle"></canvas> <small>symbol should be barely visible</small></div>
  <div id="hint">WASD move (camera-relative) · Space dodge · click: mouse look · arrows / right stick orbit · Tab / middle mouse / R3 lock-on · ` perf · 1/2/3 act, 4 arena, 5 boss · P presence · T/Y/U tell (normal/unblockable/silence)</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
